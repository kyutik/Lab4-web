<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>П’ять вертикальних рядків, що біжать</title>
</head>
<body bgcolor="#f5f5f5">
    <p align="center">
        <marquee width="800" height="250" bgcolor="#fff2cc" behavior="alternate" direction="up">
            <font color="#8b4513" face="Verdana" size="4"><b>Геометричні фігури: коло, квадрат і трикутник.</b></font>
            <br>
            <img src="image/circle.svg" width="64" height="64" alt="Коло">
            <img src="image/square.svg" width="64" height="64" alt="Квадрат">
            <img src="image/triangle.svg" width="64" height="64" alt="Трикутник">
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="250" bgcolor="#d9ead3" behavior="scroll" direction="up">
            <img src="image/circle.svg" width="64" height="64" alt="Коло"><br>
            <img src="image/square.svg" width="64" height="64" alt="Квадрат"><br>
            <img src="image/triangle.svg" width="64" height="64" alt="Трикутник">
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="250" bgcolor="#cfe2f3" behavior="slide" direction="down">
            <img src="image/circle.svg" width="64" height="64" alt="Коло"><br>
            <img src="image/square.svg" width="64" height="64" alt="Квадрат"><br>
            <img src="image/triangle.svg" width="64" height="64" alt="Трикутник">
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="250" bgcolor="#ead1dc" behavior="scroll" direction="up" scrolldelay="100" scrollamount="3">
            <font color="#800080" face="Georgia" size="5"><b><i>Вивчаємо вертикальний рух тексту із затримкою 100 мілісекунд.</i></b></font>
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="250" bgcolor="#fce5cd" behavior="scroll" direction="up" scrolldelay="500" scrollamount="3">
            <font color="#a52a2a" face="Courier New" size="4"><u>Порівнюємо вертикальний рух тексту із затримкою 500 мілісекунд.</u></font>
        </marquee>
    </p>
</body>
</html>
