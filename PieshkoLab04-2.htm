<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>П’ять горизонтальних рядків, що біжать</title>
</head>
<body bgcolor="#f5f5f5">
    <p align="center">
        <marquee width="800" height="50" bgcolor="#fff2cc" behavior="alternate" direction="left">
            <font color="#8b4513" face="Verdana" size="4"><b>Вивчаємо HTML та створюємо вебсторінки.</b></font>
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="50" bgcolor="#d9ead3" behavior="scroll" direction="left">
            <font color="#006400" face="Arial" size="5"><i>Практика допомагає краще зрозуміти нові знання.</i></font>
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="50" bgcolor="#cfe2f3" behavior="slide" direction="right">
            <font color="#000080" face="Times New Roman" size="4"><u>Зберігаємо результати лабораторної роботи.</u></font>
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="50" bgcolor="#ead1dc" behavior="scroll" direction="left" scrolldelay="100" scrollamount="3">
            <font color="#800080" face="Georgia" size="5"><b><i>Рух тексту із затримкою 100 мілісекунд.</i></b></font>
        </marquee>
    </p>
    <p align="center">
        <marquee width="800" height="50" bgcolor="#fce5cd" behavior="scroll" direction="left" scrolldelay="500" scrollamount="3">
            <font color="#a52a2a" face="Courier New" size="4">Рух тексту із затримкою 500 мілісекунд.</font>
        </marquee>
    </p>
</body>
</html>
